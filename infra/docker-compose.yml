# ---------------------------------------------------------------------------
# Plateforme ELT Eckert — environnement local complet
# Démarrage : docker compose --env-file .env up -d
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow/src
    # Connexion entrepôt + stockage objet, lues par le code applicatif
    ELT_PG_DSN: postgresql://elt_writer:${ELT_WRITER_PASSWORD}@postgres:5432/eckert
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_BUCKET: ${MINIO_BUCKET}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
    DATAGOUV_DATASET: ${DATAGOUV_DATASET}
    DATAGOUV_API: ${DATAGOUV_API}
  volumes:
    - ../dags:/opt/airflow/dags
    - ../src:/opt/airflow/src
    - ../data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- Entrepôt de données -------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eckert-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ELT_WRITER_PASSWORD: ${ELT_WRITER_PASSWORD}
      ELT_READER_PASSWORD: ${ELT_READER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../src/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Stockage objet, couche bronze --------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: eckert-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc version enable local/${MINIO_BUCKET};
      echo 'bucket ${MINIO_BUCKET} pret';
      "

  # --- Orchestration -------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: eckert-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname Eckert --role Admin --email admin@example.local || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: eckert-airflow-web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: eckert-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Calculs distribués --------------------------------------------------
  spark-master:
    image: bitnamilegacy/spark:3.5.3
    container_name: eckert-spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ../src:/opt/app/src
      - ../data:/opt/app/data

  spark-worker:
    image: bitnamilegacy/spark:3.5.3
    container_name: eckert-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - ../src:/opt/app/src
      - ../data:/opt/app/data

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
